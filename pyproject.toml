[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerhunt"
version = "0.2.0"
description = "LEDGERHUNT-CRYPTO: Stage 2 measurement harness and shared infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "base58>=2.1",
    "pycryptodome>=3.20",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ledgerhunt = "ledgerhunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
